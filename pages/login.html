<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <title>week6_login</title>
  </head>

  <body>
    <%- include('./layout/header'); -%>

    <main>
      <!-- *歡迎回來 -->
      <section class="tool-info py-8 py-lg-9">
        <div class="container py-8">
          <div>
            <!-- 標題 -->
            <div class="text-center">
              <div class="mb-2">
                <h2 class="fs-3 fs-lg-2 fs-lg-2">歡迎回來</h2>
              </div>
              <p class="fs-6 text-neutral-200 mb-6">
                登入以繼續使用 AI ToolVerse
              </p>
            </div>
            <div class="row justify-content-center">
              <div class="col-12 col-lg-4">
                <div>
                  <div>
                    <!-- 社群登入按鈕群組 -->
                    <div class="d-flex flex-column gap-4 mb-6">
                      <!-- 1. Google 登入 -->
                      <button
                        type="button"
                        class="btn btn-outline-primary login-hover border-opacity-25 rounded-pill py-2 w-100 d-flex justify-content-center align-items-center"
                      >
                        <img
                          src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2026-week6/login-google.png"
                          alt="Google"
                          class="me-2"
                        />
                        使用 Google 繼續
                      </button>

                      <!-- 2. Facebook 登入 -->
                      <button
                        type="button"
                        class="btn btn-outline-primary login-hover border-opacity-25 rounded-pill py-2 w-100 d-flex justify-content-center align-items-center"
                      >
                        <img
                          src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2026-week6/login-facebook.png"
                          alt="Facebook"
                          class="me-2"
                        />
                        使用 Facebook 繼續
                      </button>

                      <!-- 3. Apple 登入 -->
                      <button
                        type="button"
                        class="btn btn-outline-primary login-hover border-opacity-25 rounded-pill py-2 w-100 d-flex justify-content-center align-items-center"
                      >
                        <img
                          src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2026-week6/login-apple.png"
                          alt="Apple"
                          class="me-2"
                        />
                        使用 Apple 繼續
                      </button>
                    </div>

                    <!-- 分隔線提示 -->
                    <div class="d-flex align-items-center my-4">
                      <span class="divider-line"></span>
                      <span class="px-3 text-neutral-200 fs-sm text-nowrap">
                        或使用 AI ToolVerse 帳號登入
                      </span>
                      <span class="divider-line"></span>
                    </div>

                    <!-- 帳號密碼表單 -->
                    <div>
                      <!-- 帳號 -->
                      <div class="mb-3">
                        <label
                          for="exampleFormControlInput1"
                          class="form-label"
                          >電子信箱</label
                        >
                        <input
                          type="email"
                          class="form-control py-2"
                          id="exampleFormControlInput1"
                          placeholder="請輸入電子信箱"
                        />
                      </div>
                      <!-- 密碼 -->
                      <div>
                        <label
                          for="exampleFormControlInput1"
                          class="form-label"
                          >密碼</label
                        >
                        <input
                          type="password"
                          class="form-control py-2"
                          id="exampleFormControlInput1"
                          placeholder="請輸入密碼"
                        />
                      </div>
                      <!-- 記住帳號 / 忘記密碼 -->
                      <div
                        class="d-flex justify-content-between align-items-center"
                      >
                        <div>
                          <div class="form-check">
                            <input
                              class="form-check-input"
                              type="checkbox"
                              value=""
                              id="flexCheckDefault"
                            />
                            <label
                              class="form-check-label"
                              for="flexCheckDefault"
                            >
                              記住帳號
                            </label>
                          </div>
                        </div>
                        <a
                          href="#"
                          class="text-decoration-none link-primary"
                          >忘記密碼？</a
                        >
                      </div>
                      <!-- 登入按鈕 -->
                      <div class="text-center mt-5">
                        <button
                          type="button"
                          class="btn btn-primary rounded-pill py-2 px-5 w-100 login-hover"
                        >
                          登入
                        </button>
                      </div>
                      <!-- 還沒有帳號？立即註冊 -->
                      <div class="text-center mt-6 fs-sm">
                        <p>
                          還沒有帳號？
                          <a
                            href="#"
                            class="link-primary"
                          >
                            立即註冊</a
                          >
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <%- include('./layout/footer'); -%>

    <script
      type="module"
      src="../main.js"
    ></script>
  </body>
</html>
